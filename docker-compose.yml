services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pact -d pact" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pact-postgres-data:/var/lib/postgresql/data

  pact-broker:
    image: pactfoundation/pact-broker:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: postgres
      PACT_BROKER_DATABASE_PORT: 5432
      PACT_BROKER_DATABASE_NAME: pact
      PACT_BROKER_DATABASE_USERNAME: pact
      PACT_BROKER_DATABASE_PASSWORD: pact
      PACT_BROKER_BASE_URL: http://localhost:9292
      PACT_BROKER_LOG_LEVEL: INFO
    ports:
      - "9292:9292"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:9292/diagnostic/status/heartbeat >/dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  pact-postgres-data:
